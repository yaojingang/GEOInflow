# Use with docker-compose.liekan.yml. Existing PG/geography volumes and private
# configuration are preserved; new analytical data uses independent volumes.
x-warehouse-environment: &warehouse-environment
  LIEKAN_ANALYTICS_BACKEND: clickhouse
  LIEKAN_WAREHOUSE_TRANSITION: 'true'
  LIEKAN_SEED_DEMO: ${LIEKAN_SEED_DEMO:-true}
  LIEKAN_CLICKHOUSE_URL: http://warehouse-ch:8123
  LIEKAN_CLICKHOUSE_DATABASE: ${LIEKAN_CLICKHOUSE_DATABASE:-liekan}
  LIEKAN_CLICKHOUSE_USERNAME: ${LIEKAN_CLICKHOUSE_USERNAME:-liekan}
  LIEKAN_CLICKHOUSE_PASSWORD: ${LIEKAN_CLICKHOUSE_PASSWORD:?ClickHouse password required}
  LIEKAN_QUEUE_BROKERS: warehouse-queue:9092
  LIEKAN_QUEUE_STORAGE_PATH: /app/warehouse-queue-storage
  LIEKAN_QUEUE_TOPIC: ${LIEKAN_QUEUE_TOPIC:-liekan-input-v1}
  LIEKAN_RESULT_TOPIC: ${LIEKAN_RESULT_TOPIC:-liekan-authority-v1}
  LIEKAN_QUEUE_PARTITIONS: ${LIEKAN_QUEUE_PARTITIONS:-8}
  LIEKAN_QUEUE_REPLICATION_FACTOR: '1'
  LIEKAN_EXPORT_DIRECTORY: /app/warehouse-exports
  LIEKAN_CH_QUERY_MEMORY_BYTES: ${LIEKAN_CH_QUERY_MEMORY_BYTES:-1073741824}
x-warehouse-worker: &warehouse-worker
  image: liekan:1.2.0
  environment:
    <<: *warehouse-environment
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    APP_SECRET: ${APP_SECRET:?APP_SECRET required}
    DISABLE_TELEMETRY: '1'
  depends_on:
    app: {condition: service_healthy}
  volumes:
    - liekan-warehouse-queue:/app/warehouse-queue-storage:ro
  restart: unless-stopped
services:
  warehouse-ch:
    image: clickhouse/clickhouse-server:26.8.36.3@sha256:d426d2f612e1e189c90f9a3f8dcd85a03c6851273833817a296bb327e63aa7a7
    environment:
      CLICKHOUSE_DB: ${LIEKAN_CLICKHOUSE_DATABASE:-liekan}
      CLICKHOUSE_USER: ${LIEKAN_CLICKHOUSE_USERNAME:-liekan}
      CLICKHOUSE_PASSWORD: ${LIEKAN_CLICKHOUSE_PASSWORD:?ClickHouse password required}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    volumes:
      - liekan-warehouse-ch:/var/lib/clickhouse
      - ./docker/warehouse/clickhouse.xml:/etc/clickhouse-server/config.d/liekan.xml:ro
    cpus: ${LIEKAN_CH_CPUS:-4}
    mem_limit: ${LIEKAN_CH_MEMORY:-4g}
    ulimits: {nofile: {soft: 262144, hard: 262144}}
    healthcheck:
      test: ['CMD-SHELL', 'clickhouse-client --user "$${CLICKHOUSE_USER}" --password "$${CLICKHOUSE_PASSWORD}" --query "SELECT 1" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  warehouse-queue:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    entrypoint: [sh, /liekan/kafka-start.sh]
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://warehouse-queue:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@warehouse-queue:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data/logs
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_LOG_RETENTION_MS: '-1'
      KAFKA_LOG_RETENTION_BYTES: '-1'
      KAFKA_LOG_FLUSH_INTERVAL_MESSAGES: '1'
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: 'false'
      KAFKA_LOG_SEGMENT_BYTES: '134217728'
      KAFKA_METADATA_LOG_SEGMENT_BYTES: '8388608'
      KAFKA_MESSAGE_MAX_BYTES: '12582912'
      KAFKA_REPLICA_FETCH_MAX_BYTES: '12582912'
      KAFKA_HEAP_OPTS: -Xms256m -Xmx768m
      KAFKA_JVM_PERFORMANCE_OPTS: -server -XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:+ExplicitGCInvokesConcurrent -XX:MaxInlineLevel=15 -Djava.awt.headless=true
    volumes:
      - liekan-warehouse-queue:/var/lib/kafka/data
      - ./docker/warehouse/kafka-start.sh:/liekan/kafka-start.sh:ro
    # These image-declared directories hold generated config, never queue facts.
    tmpfs:
      - /etc/kafka/secrets:rw,nosuid,nodev,size=16m,uid=1000,gid=1000
      - /mnt/shared/config:rw,nosuid,nodev,size=16m,uid=1000,gid=1000
    cpus: ${LIEKAN_QUEUE_CPUS:-2}
    mem_limit: ${LIEKAN_QUEUE_CONTAINER_MEMORY:-2g}
    healthcheck:
      test: [CMD-SHELL, 'KAFKA_HEAP_OPTS="-Xms32m -Xmx128m" /opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null']
      interval: 15s
      timeout: 10s
      retries: 30
    restart: unless-stopped
  warehouse-init:
    <<: *warehouse-worker
    command: [sh, scripts/liekan-warehouse-init.sh]
    environment:
      <<: *warehouse-environment
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_SECRET: ${APP_SECRET:?APP_SECRET required}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY:?TWO_FACTOR_ENCRYPTION_KEY required}
      LIEKAN_INSTALL_MODE: ${LIEKAN_INSTALL_MODE:?Choose fresh or pg-transition}
      LIEKAN_SEED_DEMO: ${LIEKAN_SEED_DEMO:-true}
    depends_on:
      db: {condition: service_healthy}
      warehouse-ch: {condition: service_healthy}
      warehouse-queue: {condition: service_healthy}
    restart: 'no'
  app:
    environment:
      <<: *warehouse-environment
    depends_on:
      warehouse-init: {condition: service_completed_successfully}
    volumes:
      - liekan-warehouse-queue:/app/warehouse-queue-storage:ro
      - liekan-warehouse-backups:/app/warehouse-backups
      - liekan-warehouse-exports:/app/warehouse-exports
  log-worker:
    environment:
      <<: *warehouse-environment
    volumes:
      - liekan-warehouse-queue:/app/warehouse-queue-storage:ro
  analytics-worker:
    environment:
      <<: *warehouse-environment
      LIEKAN_CH_READ_CONCURRENCY: ${LIEKAN_CH_READ_CONCURRENCY:-1}
    volumes:
      - liekan-warehouse-queue:/app/warehouse-queue-storage:ro
  warehouse-worker:
    <<: *warehouse-worker
    command: [node, dist/liekan-warehouse-worker.mjs]
    cpus: ${LIEKAN_CONSUMER_CPUS:-2}
    mem_limit: ${LIEKAN_CONSUMER_MEMORY:-1g}
    healthcheck:
      test: [CMD, node, -e, "const h=JSON.parse(require('fs').readFileSync('/tmp/liekan-warehouse-worker.health.json'));process.exit(h.healthy&&Date.now()-Date.parse(h.at)<60000?0:1)"]
      interval: 15s
      timeout: 5s
      retries: 4
  warehouse-transition:
    <<: *warehouse-worker
    command: [node, dist/liekan-transition-worker.mjs]
    mem_limit: ${LIEKAN_TRANSITION_MEMORY:-1g}
    healthcheck:
      test: [CMD, node, -e, "const h=JSON.parse(require('fs').readFileSync('/tmp/liekan-transition-worker.health.json'));process.exit(h.healthy&&Date.now()-Date.parse(h.at)<120000?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 4
  warehouse-maintenance:
    <<: *warehouse-worker
    command: [node, dist/liekan-maintenance-worker.mjs]
    volumes:
      - liekan-warehouse-queue:/app/warehouse-queue-storage:ro
      - liekan-warehouse-exports:/app/warehouse-exports
    mem_limit: 512m
    healthcheck:
      test: [CMD, node, -e, "const h=JSON.parse(require('fs').readFileSync('/tmp/liekan-warehouse-maintenance.health.json'));process.exit(h.healthy&&Date.now()-Date.parse(h.at)<120000?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 4
volumes:
  liekan-warehouse-ch:
  liekan-warehouse-queue:
  liekan-warehouse-backups:
  liekan-warehouse-exports:
